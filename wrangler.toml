name = "valnce"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Workers Builds UI에는 Build output 필드가 없다.
# 정적 파일 경로는 여기 assets.directory 로 지정한다.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# 대시보드 Bindings:
#   Variable name: ROSTER
#   KV namespace: valnce_roster
# 로컬 배포 시 id가 필요하면 아래를 채운다.
# [[kv_namespaces]]
# binding = "ROSTER"
# id = "YOUR_KV_NAMESPACE_ID"
