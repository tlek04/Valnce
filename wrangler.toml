name = "valnce"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Workers Builds UI에는 Build output 필드가 없다.
# 정적 파일 경로는 여기 assets.directory 로 지정한다.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Secrets (대시보드): HENRIK_API_KEY
[[kv_namespaces]]
binding = "ROSTER"
id = "c94cfa210bfb4b78af3268219335e564"
